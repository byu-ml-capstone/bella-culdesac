services:
  hello:
    build: ./hello
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      APP_URL: ${SERVICE_FQDN_HELLO}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Denver}
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppass}@db:5432/${POSTGRES_DB:-appdb}
      ATTACHMENTS_DIR: /app/storage/attachments
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-local-reset-secret-change-me}
      INVITATION_SECRET: ${INVITATION_SECRET:-local-invitation-secret-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-litellm}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://ml-capstone.cs.byu.edu:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-noauth}
      LITELLM_MODEL: ${LITELLM_MODEL:-classroom-chat}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      ALLOW_ADMIN_RESET: ${ALLOW_ADMIN_RESET:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachments-data:/app/storage/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  attachments-data:
